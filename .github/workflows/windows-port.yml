name: Windows Port

on:
  push:
    paths:
      - "windows-web/**"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows-port.yml"
  pull_request:
    paths:
      - "windows-web/**"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows-port.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate dashboard
        working-directory: windows-web
        run: npm run validate
      - name: Install packager
        working-directory: windows-web
        run: npm install
      - name: Build Windows executable
        working-directory: windows-web
        run: npm run build:windows
      - name: Package executable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\AIUsage-Windows | Out-Null
          Copy-Item dist\AIUsage-Windows.exe dist\AIUsage-Windows\AIUsage.exe
          Copy-Item ..\docs\WINDOWS.md dist\AIUsage-Windows\WINDOWS.md
          Compress-Archive -Path dist\AIUsage-Windows\* -DestinationPath AIUsage-Windows.zip -Force
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: AIUsage-Windows
          path: AIUsage-Windows.zip
          if-no-files-found: error
      - name: Upload standalone executable
        uses: actions/upload-artifact@v6
        with:
          name: AIUsage-Windows-exe
          path: windows-web/dist/AIUsage-Windows.exe
          if-no-files-found: error
